<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Single SVG mark; it carries its own light/dark fill rule, so there is
         no second file and no @2x variant to keep in sync. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kuldeep Yadav, a software engineer in India with 2+ years building zero to one: AI, startups, and how things work underneath."
    />
    <meta name="keywords" content="Kuldeep Yadav, Software Engineer, Portfolio" />
    <link rel="canonical" href="https://kuldeeep.is-a.dev/" />
    <link rel="alternate" type="application/rss+xml" title="Kuldeep Yadav — Writings" href="/rss.xml" />
    <!-- Link previews (LinkedIn, X, Slack, WhatsApp). These crawlers don't run JS,
         so every route shares this card; only Google sees per-post titles. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kuldeep Yadav" />
    <meta property="og:title" content="Kuldeep Yadav — Software Engineer" />
    <meta property="og:description" content="Engineer based in India building zero to one. Obsessed with AI, startups and how things work underneath." />
    <meta property="og:url" content="https://kuldeeep.is-a.dev/" />
    <meta property="og:image" content="https://kuldeeep.is-a.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@iamkuldeepY" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kuldeep Yadav",
        "jobTitle": "Software Engineer",
        "url": "https://kuldeeep.is-a.dev/",
        "sameAs": [
          "https://github.com/kuldeeepy",
          "https://www.linkedin.com/in/kuldeeep-yadav/",
          "https://x.com/iamkuldeepY",
          "https://leetcode.com/u/kuldeeepy/"
        ]
      }
    </script>
    <!-- Only used for the "open to work" annotation, so just the one weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media=print keeps it off the critical path; it swaps in once loaded. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Kuldeep Yadav — Software Engineer</title>
    <!-- Google tag, fetched only after load + idle so it never competes with the page. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FRD1H9GGXZ');
      addEventListener('load', function () {
        (window.requestIdleCallback || setTimeout)(function () {
          var s = document.createElement('script');
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-FRD1H9GGXZ';
          s.async = true;
          document.head.appendChild(s);
        });
      });
    </script>
  </head>
  <body>

</html>
